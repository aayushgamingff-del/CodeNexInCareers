<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #3a7bd5, #00d2ff);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            padding: 2.5rem 3rem;
            border-radius: 18px;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }
        h1 {
            margin: 0 0 1rem;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }
        p {
            margin: 0;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello!</h1>
        <p>Your simple index page is ready.</p>
        <p>Use this space to prototype upcoming features and share quick updates.</p>
        <p>Start customizing the layout, drop in widgets, or plug in live data when youre set.</p>
    </div>
</body>
</html>
